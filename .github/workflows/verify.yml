name: Repository Verification

on:
  pull_request:
  push:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependency install step: the project uses only the standard library.
      - name: Run the shared verification contract
        env:
          PROTECTED_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD' }}
        run: bash scripts/verify_repo.sh
